# Applying this Blueprint provisions paid compute and a 1 GB persistent disk.
# For the existing standalone service, apply the same settings in its dashboard
# instead of creating a second service.
services:
  - type: web
    name: gpt-audio-mcp-v2
    runtime: node
    repo: https://github.com/Lisuiwen/GPTAudioPlugin
    branch: main
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run typecheck && npm test
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: gpt-audio-auth
      mountPath: /var/data/gpt-audio
      sizeGB: 1
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://gpt-audio-mcp-v2.onrender.com
      - key: AUTH_DATA_DIR
        value: /var/data/gpt-audio
      - key: REPLICATE_ANALYSIS_MODEL
        value: lucataco/qwen2.5-omni-7b
