# Free deployment for temporary testing. OAuth files are lost on sleep/restart.
# For durable OAuth, upgrade this same service and attach persistent storage;
# see README.md. Do not create a duplicate service for an existing deployment.
services:
  - type: web
    name: gpt-audio-mcp-v2
    runtime: node
    repo: https://github.com/Lisuiwen/GPTAudioPlugin
    branch: main
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run typecheck && npm test
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://gpt-audio-mcp-v2.onrender.com
      - key: REPLICATE_ANALYSIS_MODEL
        value: lucataco/qwen2.5-omni-7b
