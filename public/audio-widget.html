<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPT Audio Plugin</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; background: transparent; }
    main { display: grid; gap: 12px; }
    h2 { margin: 0; font-size: 16px; }
    .hint { margin: 0; opacity: .72; font-size: 12px; line-height: 1.45; }
    label { display: grid; gap: 6px; font-size: 12px; font-weight: 600; }
    textarea,
    input[type="text"],
    input[type="number"] {
      width: 100%;
      border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      border-radius: 10px;
      padding: 9px 10px;
      background: color-mix(in srgb, Canvas 96%, currentColor 4%);
      color: CanvasText;
      font: inherit;
      resize: vertical;
    }
    textarea { min-height: 82px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .model-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
    button {
      border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      border-radius: 10px;
      padding: 8px 11px;
      background: color-mix(in srgb, Canvas 92%, currentColor 8%);
      color: CanvasText;
      cursor: pointer;
      font-weight: 600;
    }
    button.primary { background: CanvasText; color: Canvas; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .status,
    .file { font-size: 12px; opacity: .8; overflow-wrap: anywhere; line-height: 1.45; }
    .status.ok { opacity: 1; }
    .status.warn { opacity: 1; }
    #result { display: none; gap: 8px; padding-top: 4px; }
    #result.visible { display: grid; }
    #error { display: none; font-size: 12px; white-space: pre-wrap; }
    #error.visible { display: block; }
    audio { width: 100%; }
  </style>
</head>
<body>
  <main>
    <div>
      <h2>GPT Audio Plugin</h2>
      <p class="hint">
        ChatGPT supplies the conversation summary and music-director prompt.
        Replicate is connected separately and billed to the user's own account.
      </p>
    </div>

    <label>
      Conversation summary
      <textarea id="context" placeholder="Relevant context from the current ChatGPT conversation."></textarea>
    </label>

    <label>
      GPT director prompt
      <textarea id="prompt" placeholder="Production-ready music direction prepared by ChatGPT."></textarea>
    </label>

    <div class="model-row">
      <label>
        Replicate model
        <input id="modelInput" type="text" placeholder="owner/name or owner/name:version" />
      </label>
      <button id="inspect" type="button">Connect / Check model</button>
    </div>

    <div id="capability" class="status">
      Connect Replicate and check the model before adding reference audio.
    </div>

    <div class="row">
      <label style="width: 110px;">
        Duration (sec)
        <input id="duration" type="number" min="1" max="30" value="8" />
      </label>
      <button id="upload" type="button" disabled>Upload audio</button>
      <button id="record" type="button" disabled>Record</button>
      <button id="clear" type="button" disabled>Clear audio</button>
      <input id="fileInput" type="file" accept="audio/*" hidden />
    </div>

    <div id="fileLabel" class="file">No reference audio selected.</div>

    <div class="row">
      <label style="display:flex;align-items:center;gap:6px;font-weight:500;">
        <input id="continuation" type="checkbox" disabled />
        Continue reference audio
      </label>
    </div>

    <button id="generate" class="primary" type="button">Generate with Replicate</button>

    <div id="error"></div>

    <section id="result">
      <audio id="player" controls></audio>
      <div id="resultModel" class="file"></div>
    </section>
  </main>

  <script>
    const openai = window.openai;

    const contextEl = document.querySelector("#context");
    const promptEl = document.querySelector("#prompt");
    const modelInputEl = document.querySelector("#modelInput");
    const inspectEl = document.querySelector("#inspect");
    const capabilityEl = document.querySelector("#capability");
    const durationEl = document.querySelector("#duration");
    const continuationEl = document.querySelector("#continuation");
    const uploadEl = document.querySelector("#upload");
    const recordEl = document.querySelector("#record");
    const clearEl = document.querySelector("#clear");
    const fileInputEl = document.querySelector("#fileInput");
    const fileLabelEl = document.querySelector("#fileLabel");
    const generateEl = document.querySelector("#generate");
    const errorEl = document.querySelector("#error");
    const resultEl = document.querySelector("#result");
    const playerEl = document.querySelector("#player");
    const resultModelEl = document.querySelector("#resultModel");

    let referenceAudio = null;
    let mediaRecorder = null;
    let recordingStream = null;
    let chunks = [];
    let checkedModel = null;
    let capabilities = null;

    function hydrate(input, output) {
      contextEl.value =
        input?.conversationSummary ??
        output?.conversationSummary ??
        contextEl.value ??
        "";

      promptEl.value =
        input?.directorPrompt ??
        output?.directorPrompt ??
        promptEl.value ??
        "";

      const incomingModel = input?.model ?? output?.model;
      if (incomingModel && !modelInputEl.value) {
        modelInputEl.value = incomingModel;
      }

      renderResult(output);
    }

    hydrate(openai?.toolInput ?? {}, openai?.toolOutput ?? {});

    window.addEventListener(
      "openai:set_globals",
      (event) => {
        const globals = event?.detail?.globals ?? {};
        hydrate(globals.toolInput ?? {}, globals.toolOutput ?? {});
      },
      { passive: true }
    );

    function setError(message) {
      errorEl.textContent = message || "";
      errorEl.classList.toggle("visible", Boolean(message));
    }

    function setReferenceAudio(file) {
      referenceAudio = file;
      clearEl.disabled = !file;
      fileLabelEl.textContent = file
        ? `Reference: ${file.file_name || file.file_id}`
        : "No reference audio selected.";
    }

    function setCapabilities(data) {
      capabilities = data;
      checkedModel = data?.model || null;

      const supportsAudio = Boolean(data?.supportsAudioInput);
      uploadEl.disabled = !supportsAudio;
      recordEl.disabled = !supportsAudio;
      continuationEl.disabled = !supportsAudio;

      if (!supportsAudio) {
        setReferenceAudio(null);
        continuationEl.checked = false;
      }

      if (!data) {
        capabilityEl.textContent =
          "Connect Replicate and check the model before adding reference audio.";
        capabilityEl.className = "status";
        return;
      }

      if (data.unsupportedRequiredFields?.length) {
        capabilityEl.textContent =
          `Model needs additional required fields not mapped yet: ${data.unsupportedRequiredFields.join(", ")}.`;
        capabilityEl.className = "status warn";
        return;
      }

      if (supportsAudio) {
        capabilityEl.textContent =
          `✓ Reference audio supported via "${data.audioField}".`;
        capabilityEl.className = "status ok";
      } else {
        capabilityEl.textContent =
          "This model is text-only from GPTAudioPlugin's perspective. Upload and recording are disabled.";
        capabilityEl.className = "status warn";
      }
    }

    async function callTool(name, args) {
      if (!openai?.callTool) {
        throw new Error("This host does not expose the ChatGPT tool-call bridge.");
      }
      return openai.callTool(name, args);
    }

    inspectEl.addEventListener("click", async () => {
      setError("");
      inspectEl.disabled = true;
      inspectEl.textContent = "Checking…";

      try {
        const model = modelInputEl.value.trim();
        if (!model) throw new Error("Replicate model is required.");

        const response = await callTool("inspect_replicate_model", { model });
        if (response?.isError) {
          throw new Error(
            response?.content
              ?.filter((item) => item?.type === "text")
              ?.map((item) => item.text)
              ?.join("\n") || "Model inspection failed."
          );
        }

        setCapabilities(response?.structuredContent ?? response);
      } catch (error) {
        setCapabilities(null);
        setError(error instanceof Error ? error.message : String(error));
      } finally {
        inspectEl.disabled = false;
        inspectEl.textContent = "Connect / Check model";
      }
    });

    modelInputEl.addEventListener("input", () => {
      if (modelInputEl.value.trim() !== checkedModel) {
        setCapabilities(null);
      }
    });

    async function uploadToChatGPT(file) {
      if (!openai?.uploadFile || !openai?.getFileDownloadUrl) {
        throw new Error(
          "This ChatGPT host does not expose the file upload APIs required by the plugin."
        );
      }

      const uploaded = await openai.uploadFile(file);
      const resolved = await openai.getFileDownloadUrl({
        fileId: uploaded.fileId,
      });

      return {
        download_url: resolved.downloadUrl,
        file_id: uploaded.fileId,
        mime_type: file.type || "audio/webm",
        file_name: file.name || "reference-audio.webm",
      };
    }

    uploadEl.addEventListener("click", () => fileInputEl.click());

    fileInputEl.addEventListener("change", async () => {
      const file = fileInputEl.files?.[0];
      if (!file) return;

      setError("");
      fileLabelEl.textContent = "Uploading reference audio…";

      try {
        setReferenceAudio(await uploadToChatGPT(file));
      } catch (error) {
        setReferenceAudio(null);
        setError(error instanceof Error ? error.message : String(error));
      }
    });

    clearEl.addEventListener("click", () => {
      setReferenceAudio(null);
      fileInputEl.value = "";
      continuationEl.checked = false;
    });

    recordEl.addEventListener("click", async () => {
      setError("");

      if (mediaRecorder?.state === "recording") {
        mediaRecorder.stop();
        recordEl.textContent = "Record";
        return;
      }

      if (!navigator.mediaDevices?.getUserMedia) {
        setError("Microphone recording is not available in this host.");
        return;
      }

      try {
        recordingStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
        });
        chunks = [];
        mediaRecorder = new MediaRecorder(recordingStream);

        mediaRecorder.addEventListener("dataavailable", (event) => {
          if (event.data.size > 0) chunks.push(event.data);
        });

        mediaRecorder.addEventListener("stop", async () => {
          try {
            const mimeType = mediaRecorder.mimeType || "audio/webm";
            const blob = new Blob(chunks, { type: mimeType });
            const file = new File(
              [blob],
              `recording-${Date.now()}.webm`,
              { type: mimeType }
            );

            fileLabelEl.textContent = "Uploading recording…";
            setReferenceAudio(await uploadToChatGPT(file));
          } catch (error) {
            setReferenceAudio(null);
            setError(error instanceof Error ? error.message : String(error));
          } finally {
            recordingStream?.getTracks().forEach((track) => track.stop());
            recordingStream = null;
          }
        });

        mediaRecorder.start();
        recordEl.textContent = "Stop recording";
        fileLabelEl.textContent = "Recording…";
      } catch (error) {
        setError(error instanceof Error ? error.message : String(error));
      }
    });

    function renderResult(data) {
      if (!data) return;

      if (data.error) {
        setError(data.error);
      }

      if (data.audioUrl) {
        playerEl.src = data.audioUrl;
        resultModelEl.textContent = data.model
          ? `Model: ${data.model}`
          : "";
        resultEl.classList.add("visible");
      }
    }

    generateEl.addEventListener("click", async () => {
      setError("");
      resultEl.classList.remove("visible");

      const conversationSummary = contextEl.value.trim();
      const directorPrompt = promptEl.value.trim();
      const model = modelInputEl.value.trim();

      if (!conversationSummary) {
        setError("Conversation summary is required.");
        return;
      }

      if (!directorPrompt) {
        setError("GPT director prompt is required.");
        return;
      }

      if (!model) {
        setError("Replicate model is required.");
        return;
      }

      if (referenceAudio && checkedModel !== model) {
        setError("Check this model again before sending reference audio.");
        return;
      }

      if (referenceAudio && !capabilities?.supportsAudioInput) {
        setError("The selected model does not support reference audio.");
        return;
      }

      generateEl.disabled = true;
      generateEl.textContent = "Generating…";

      try {
        const response = await callTool("generate_music", {
          model,
          conversationSummary,
          directorPrompt,
          duration: Math.max(
            1,
            Math.min(30, Number(durationEl.value || 8))
          ),
          referenceAudio: referenceAudio || undefined,
          continuation: Boolean(
            referenceAudio && continuationEl.checked
          ),
        });

        const data = response?.structuredContent ?? response;
        renderResult(data);

        if (response?.isError) {
          throw new Error(
            response?.content
              ?.filter((item) => item?.type === "text")
              ?.map((item) => item.text)
              ?.join("\n") || "Generation failed."
          );
        }
      } catch (error) {
        setError(error instanceof Error ? error.message : String(error));
      } finally {
        generateEl.disabled = false;
        generateEl.textContent = "Generate with Replicate";
      }
    });
  </script>
</body>
</html>
